const PLUT = (() => { const t = []; for (let b = 0; b < 16; b++) { const a = new Uint8Array(256), st = 255 / (PLV - 1); for (let v = 0; v < 256; v++) { const q = v / st, f = Math.floor(q), fr = q - f; a[v] = Math.min(255, Math.round((f + (fr > (b + .5) / 16 ? 1 : 0)) * st)); } t.push(a); } return t; })();

  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i += 4) { const L = PLUT[BAY[(x & 3) | ((y & 3) << 2)]]; d[i] = L[d[i]]; d[i + 1] = L[d[i + 1]]; d[i + 2] = L[d[i + 2]]; }
