name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Icono JAVI TOP
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/
          done
          ls -la android/app/src/main/res/mipmap-xxxhdpi

      - name: Sync web assets
        run: npx cap sync android

      - name: Landscape and fullscreen
        run: |
          sed -i 's/android:name="\([^"]*MainActivity\)"/android:name="\1" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml || true
          sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>' android/app/src/main/res/values/styles.xml || true
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml || echo "AVISO: no se aplico la orientacion"
          grep -n "windowFullscreen" android/app/src/main/res/values/styles.xml || echo "AVISO: no se aplico pantalla completa"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: javi-top-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
